{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <title>{% block title %}Proyecto Bover{% endblock %}</title>
</head>
<body>
    <div class="portada">
        <img src="{% static 'banner.png' %}" class="img-fluid" alt="portada">
    </div>
    <nav class="navbar navbar-expand-sm paginas">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center fs-5" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item ms-3 me-3 enlaces">
                        <a class="nav-link active" aria-current="page" href="{% url 'inicio' %}">Inicio</a>
                    </li>
                    <li class="nav-item ms-3 me-3 enlaces">
                        <a class="nav-link active" aria-current="page" href="{% url 'registrar_prod' %}">Registrar</a>
                    </li>
                    <li class="nav-item ms-3 me-3 enlaces">
                        <a class="nav-link active" href="{% url 'listar_prod' %}">Mostrar</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <br>
    <div class="container">
        {% block content %} <!-- Dentro de este bloque van los div asociados a las clases "titulo", "imagen" y "texto" -->
        {% endblock %}
    </div>
    <br>
    <footer>
        <div class="frase">
            <h4>Gestión eficiente de tus productos, todo en un solo lugar.</h4>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
</body>
</html>
