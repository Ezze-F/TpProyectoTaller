{% extends 'productos/base_productos.html' %}
{% load static %}

{% block title %}Registrar Producto{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-lg">
        <div class="card-header text-white text-center bg-success subtitulo">
            <h4>Registrar un nuevo producto</h4>
        </div>
        <div class="card-body">
            <form method="POST" id="registroProductoForm">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                    <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#confirmacionModal">
                        Agregar producto
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal de confirmación -->
<div class="modal fade" id="confirmacionModal" tabindex="-1" aria-labelledby="confirmacionModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="confirmacionModalLabel">Confirmar Registro</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                ¿Estás seguro de que quieres registrar este producto?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary" form="registroProductoForm">Confirmar Registro</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
