{% load static %}
<!DOCTYPE html>
<html lang="es"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>{% block title %}Productos{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="{% static 'style.css' %}">
    
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-light">

    <!-- Portada/Banner -->
    <div class="portada">
        <img src="{% static 'banner.png' %}" class="img-fluid w-100" alt="portada">
    </div>

    <!-- Navegación principal -->
    <nav class="navbar navbar-expand-sm paginas bg-white shadow-sm">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Mostrar navegación">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center fs-5" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item ms-3 me-3 enlaces">
                        <a class="nav-link {% if request.resolver_match.url_name == 'inicio' %}active{% endif %}" href="{% url 'inicio' %}">Principal</a>
                    </li>
                    <li class="nav-item ms-3 me-3 enlaces">
                        <a class="nav-link {% if request.resolver_match.url_name == 'listar_prod' %}active{% endif %}" href="{% url 'listar_prod' %}">Productos</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido de la página -->
    <main class="container my-4">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Pie de página -->
    <footer class="text-center py-3 bg-dark text-white">
        <div class="frase">
            <h5>Gestión eficiente de tus productos, todo en un solo lugar.</h5>
        </div>
    </footer>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
