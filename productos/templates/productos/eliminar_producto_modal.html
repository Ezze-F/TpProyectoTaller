<form method="post" action="{% url 'eliminar_prod' producto.pk %}">
    {% csrf_token %}
    <p>¿Estás seguro de que deseas eliminar el producto <strong>{{ producto.descripcion }}</strong>?</p>
    <div class="mt-3">
        <button type="submit" class="btn btn-danger">Eliminar</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
    </div>
</form>
