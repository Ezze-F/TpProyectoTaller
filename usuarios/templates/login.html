{% extends 'baselogin.html' %}
{% block content %}
<div class="forma">
    <div class="col-12">
        <h2>Iniciar sesión</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            {% if error %}
            <p>{{ error }}</p>
            {% endif %}
            <button type="submit" class="btn btn-primary boton">INGRESAR</button>
            {% endblock %}
        </form>
    </div>
</div>
