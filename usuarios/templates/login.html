{% extends 'baselogin.html' %}
{% block content %}
<div class="cuadrologin">
    <div class="forma">
        <div class="col-12">
            <h2 class="titulologin">Iniciar Sesión</h2>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
                {% endif %}
                <button type="submit" class="btn btn-primary boton" id="bingreso">INGRESAR</button>
                {% endblock %}
            </form>
        </div>
    </div>
</div>
