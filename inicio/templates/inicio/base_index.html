{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <title>{% block title %}Proyecto Bover{% endblock %}</title>
</head>
<body class="ini">
    <nav class="navbar navbar-expand-lg bg-orange-custom p-3">
        <div class="container-fluid">
            <img src="{% static 'banner.png' %}" alt="Logo" class="img-fluid" style="max-height: 60px;">
            <div class="d-flex flex-wrap gap-2 justify-content-end">
                <a href="{% url 'inicio' %}" class="btn btn-orange">Inicio</a>
                <a href="{% url 'listar_prod' %}" class="btn btn-orange">Productos</a>
            </div>
        </div>
    </nav>
    <br>
    
    <div class="background-image left-image"></div>
    <div class="background-image right-image"></div>   

    <div class="container">
        {% block content %} <!-- Dentro de este bloque van los div asociados a las clases "titulo", "imagen" y "texto" -->
        {% endblock %}
    </div>
    <br>
    <footer>
        <div class="frase">
            <h4>Gestión eficiente de tus productos, todo en un solo lugar.</h4>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
</body>
</html>
